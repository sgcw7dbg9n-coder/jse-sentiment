name: jse-sentiment
channels:
  - conda-forge
dependencies:
  # pytorch on conda-forge only supports up to 3.13 on Windows
  - python=3.12

  - pandas
  - numpy
  - scipy
  - scikit-learn
  - statsmodels

  - yfinance
  - google-cloud-bigquery
  - db-dtypes
  - pyarrow
  - requests
  - beautifulsoup4

  - vadersentiment
  - pytorch-cpu
  - transformers

  # 1.50+ for the light and dark themes in .streamlit/config.toml
  - streamlit>=1.50
  - plotly
  - matplotlib
  - seaborn

  - jupyterlab
  - ipykernel
  - pyyaml
  - python-dotenv
  - tqdm
  - pytest
