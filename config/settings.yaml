study_period:
  start: "2024-01-01"
  end: "2026-06-30"

prices:
  # Starts early so lagged returns and 20-day volatility exist on the first study day,
  # and runs past the study end so 5-day-ahead targets exist for late June 2026
  start: "2023-10-01"
  end: "2026-07-15"

market_proxy:
  ticker: STX40.JO
  name: Satrix 40 ETF

sens:
  base_url: https://clientportal.jse.co.za
  # robots.txt allows general crawlers; keep the pace gentle and identify the project honestly
  delay_seconds: 3
  user_agent: "jse-sentiment-research/1.0 (Eduvos honours research project; non-commercial academic use)"

sentiment:
  finbert_model: ProsusAI/finbert
  batch_size: 32
  # Download from https://sraf.nd.edu/loughranmcdonald-master-dictionary/ (free for individual researchers)
  lm_dictionary: data/external/Loughran-McDonald_MasterDictionary_1993-2025.csv

features:
  scores: [vader_score, finbert_score, lm_score, gdelt_tone]
  rolling_windows: [3, 5]
  return_lags: 5
  volatility_windows: [5, 20]
  volume_window: 20
  # Days ahead for the movement target; 1 is the main model, 3 and 5 are for the sensitivity analysis
  horizons: [1, 3, 5]

modelling:
  # Train and tune on 2024-2025; the first half of 2026 is held out and only used once, for the final test
  train_end: "2025-12-31"
  cv_splits: 5
  random_state: 42
  main_target: target_up_1d
  feature_sets: [baseline, all_sentiment, vader_score, finbert_score, lm_score, gdelt_tone]
  sensitivity_targets: [target_excess_up_1d, target_up_3d, target_excess_up_3d, target_up_5d, target_excess_up_5d]
  # log_volume is left out on purpose: its level differs by company, so it would act as a company identifier
  baseline_features: [ret, ret_lag1, ret_lag2, ret_lag3, ret_lag4, ret_lag5, vol_5d, vol_20d, volume_ratio,
                      hl_range, mkt_ret, mkt_ret_lag1, mkt_vol_20d, excess_ret]
  grids:
    logistic_regression: {C: [0.01, 0.1, 1.0]}
    random_forest: {max_depth: [3, 6, null], min_samples_leaf: [20, 50]}
    svm_rbf: {C: [0.1, 1.0, 10.0]}

market:
  timezone: Africa/Johannesburg
  # The JSE closing auction ends at 17:00, so text from then on can only move the next session
  close_time: "17:00"

gdelt:
  max_gb: 500
  # Headline matches across every outlet; SA outlets are selected afterwards in clean_news.py
  query: sql/03_headline_mentions_all_domains.sql
  output: data/raw/gdelt_headlines.parquet
  # An outlet counts as South African if its domain ends in one of these suffixes or is listed below
  sa_domain_suffixes: [.co.za, .org.za]
  sa_extra_domains:
    - news24.com
    - fin24.com
    - miningweekly.com
    - bizcommunity.com
    - sabcnews.com
    - enca.com
    - biznews.com
    - dailyinvestor.com
    - thesouthafrican.com
    - cnbcafrica.com
    - miningmx.com

# Final sample: the 10 of 14 candidates with the most headline mentions in the
# 2026-11-12 GDELT run (210.5 GB scanned, 5,244 article/ticker rows).
# pattern: RE2 regex matched against lowercased GDELT headlines.
# exclude: Python regex (case-insensitive) for headlines that name the company without being
# about it: sponsored events and venues, economic indices, and bank economists' commentary.
# sens_ids: the company's "Equity Issuer" entries on the JSE client portal SENS page.
companies:
  - {ticker: SBK.JO, name: Standard Bank, sector: Banking, pattern: '\bstandard bank\b',
     exclude: 'joy of jazz|young artist|economist|[-–] standard bank$', sens_ids: [1459, 1460]}
  - {ticker: ABG.JO, name: Absa, sector: Banking, pattern: '\babsa\b',
     exclude: 'absa pmi|purchasing managers|cape epic|absa premiership|run your city|economist|[-–] absa$',
     sens_ids: [1596]}
  - {ticker: NED.JO, name: Nedbank, sector: Banking, pattern: '\bnedbank\b',
     exclude: 'nedbank cup|golf challenge|economist|[-–] nedbank$', sens_ids: [3629, 1338]}
  - {ticker: FSR.JO, name: FirstRand, sector: Banking, pattern: '\bfirstrand\b|\bfirst national bank\b|\bfnb\b',
     exclude: 'fnb stadium|fnb/ber|ber/fnb|consumer confidence|economist|[-–] fnb$', sens_ids: [1665, 1664]}
  - {ticker: VOD.JO, name: Vodacom, sector: Telecommunications, pattern: '\bvodacom\b',
     exclude: 'vodacom bulls|durban july|vodacom cup', sens_ids: [2659]}
  - {ticker: MTN.JO, name: MTN Group, sector: Telecommunications, pattern: '\bmtn\b',
     exclude: '\bmtn ?8\b', sens_ids: [1863]}
  - {ticker: WHL.JO, name: Woolworths, sector: Retail, pattern: '\bwoolworths\b',
     exclude: 'woolworths group|australia', sens_ids: [1944]}
  - {ticker: SHP.JO, name: Shoprite, sector: Retail, pattern: '\bshoprite\b', sens_ids: [1559, 1560]}
  - {ticker: SSW.JO, name: Sibanye-Stillwater, sector: Mining, pattern: '\bsibanye\b', sens_ids: [5443]}
  - {ticker: SOL.JO, name: Sasol, sector: Energy, pattern: '\bsasol\b',
     exclude: 'sasol banyana|sasol league|women.s league|solar challenge', sens_ids: [1506]}

excluded_candidates:
  - {ticker: CPI.JO, name: Capitec, articles: 224, headline_mentions: 120}
  - {ticker: AGL.JO, name: Anglo American, articles: 176, headline_mentions: 117}
  - {ticker: NPN.JO, name: Naspers, articles: 39, headline_mentions: 35}
  - {ticker: PRX.JO, name: Prosus, articles: 30, headline_mentions: 30}