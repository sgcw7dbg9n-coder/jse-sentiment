[browser]
gatherUsageStats = false

# Neutral accent so selected widgets never borrow a series colour; surfaces match the chart palette
[theme.light]
primaryColor = "#52514e"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#898781"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"
